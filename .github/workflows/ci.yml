name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # the tests never start Electron, so its binary is not needed here
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Licences of shipped packages (permissive only)
        run: npm run check:licenses
      - name: Known vulnerabilities in shipped packages (high and above fail)
        run: npm audit --omit=dev --audit-level=high
