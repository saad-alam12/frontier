appId: app.frontier.desktop
productName: Frontier
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - prompts/**
  # pdfjs installs a canvas library for drawing pages in Node; the app draws pages with Electron's own
  # browser engine instead, and the library's binary bundles MPL-2.0 code (docs/progress.md, Decisions)
  - '!node_modules/@napi-rs/canvas*/**'
  # diagrams are drawn by the window, whose bundle (out/) already holds Mermaid; the package's own files are not needed
  - '!node_modules/mermaid/**'
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk*/**
  - node_modules/@huggingface/transformers/**
  - node_modules/onnxruntime-node/**
mac:
  target: dir
  category: public.app-category.education
  identity: null
win:
  target: dir
linux:
  target: dir
